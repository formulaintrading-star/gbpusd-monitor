name: GBPUSD Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check.py
        env:
          TWELVE_DATA_KEY: ${{ 774564e850394175bb5f71a050d5158b }}
          NTFY_TOPIC: ${{ gbpusdalertx7k2p9 }}
          THRESHOLD_PIPS: '19.5'
      - run: |
          git config user.name "gbpusd-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
